[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pd_disaggregation_demo"]
module-root = "src"

[project]
name = "pd-disaggregation-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "ty>=0.0.26",
]
